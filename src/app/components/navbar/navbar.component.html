<header class="site-header">
  <nav class="navbar container" aria-label="Navegación principal">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="NEXUS CARS, inicio">
      <span class="brand-mark" aria-hidden="true">NC</span>
      <span class="brand-copy"><strong>NEXUS</strong><small>CARS</small></span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-content" [class.is-open]="menuOpen">
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
        <a routerLink="/servicios" routerLinkActive="active" (click)="closeMenu()">Servicios</a>
        <a routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">Nosotros</a>
        <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
      </div>
      <a class="nav-login" routerLink="/login" (click)="closeMenu()">
        <span aria-hidden="true">&#8594;</span> Iniciar sesión
      </a>
    </div>
  </nav>
</header>
